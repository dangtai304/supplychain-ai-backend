# Render Blueprint for the API. The database is Supabase (see supabase/migrations), not Render.
services:
  - type: web
    name: supplychain-ai-backend
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SUPABASE_URL
        value: https://idmvewikcsvrelguukhq.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_RnG7LqDtC9sPJ65wA2cUug_0zBOvqlz
      - key: ANTHROPIC_API_KEY
        sync: false # set in the Render dashboard
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
      - key: CORS_ORIGINS
        value: https://supplychain-ai-frontend.vercel.app,http://localhost:5173
      - key: DISPLAY_TZ
        value: Asia/Bangkok
